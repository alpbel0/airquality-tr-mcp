[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airquality-tr-mcp"
version = "1.0.0"
description = "MCP server for Turkey's official UHKIA air quality data"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "tzdata>=2026.3 ; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airquality_tr_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
